<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1f2933;
      }
      code {
        background: #f4f5f7;
        padding: 2px 6px;
        border-radius: 4px;
      }
      form {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Smart Expense Tracker</h1>
    <p>Upload a CSV or Excel file with columns <code>date</code>, <code>description</code>, and <code>amount</code>.</p>
    <form action="/api/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv,.xlsx" required />
      <button type="submit">Upload</button>
    </form>
    <p>Summary: <a href="/api/summary">/api/summary</a> or <a href="/api/summary?month=2026-09">/api/summary?month=2026-09</a></p>
  </body>
</html>
